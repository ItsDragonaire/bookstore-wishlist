<!DOCTYPE html>
      <div class="input-grid">

        <div class="field-group">
          <label for="isbnInput">isbn</label>
          <input id="isbnInput" type="text" placeholder="9780143127741" />
        </div>

        <div class="field-group">
          <label for="titleInput">title</label>
          <input id="titleInput" type="text" placeholder="the brothers karamazov" />
        </div>

        <div class="field-group">
          <label for="authorInput">author</label>
          <input id="authorInput" type="text" placeholder="fyodor dostoevsky" />
        </div>

        <div class="button-group">
          <button id="addBookBtn">add book</button>
          <button id="scanBtn" class="ghost-btn">scan barcode</button>
        </div>
      </div>

      <div class="toolbar-row">
        <input id="searchInput" type="search" placeholder="search books" />

        <select id="sortSelect">
          <option value="priority">priority</option>
          <option value="title">title</option>
          <option value="author">author</option>
          <option value="year">year</option>
        </select>

        <button id="exportCsvBtn" class="ghost-btn">csv</button>
        <button id="exportJsonBtn" class="ghost-btn">json</button>
        <button id="importJsonBtn" class="ghost-btn">import</button>

        <input id="jsonFileInput" type="file" accept="application/json" hidden />
      </div>
    </section>

    <section class="scanner-panel card hidden" id="scannerPanel">
      <div class="scanner-header">
        <h2>barcode scanner</h2>
        <button id="closeScannerBtn" class="ghost-btn">close</button>
      </div>

      <div id="scannerReader"></div>
    </section>

    <main>
      <section class="book-list card">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th></th>
                <th>book</th>
                <th>author</th>
                <th>publisher</th>
                <th>isbn</th>
                <th>year</th>
                <th>pages</th>
                <th>format</th>
                <th>qty</th>
                <th>priority</th>
                <th>notes</th>
                <th>actions</th>
              </tr>
            </thead>

            <tbody id="bookTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

  </div>
</body>
</html>
