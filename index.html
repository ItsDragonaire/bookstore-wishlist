<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <link
    rel="manifest"
    href="./manifest.webmanifest"
  />

  <link
    rel="icon"
    href="./assets/icons/favicon-32.png"
    sizes="32x32"
  />
  
  <link
    rel="apple-touch-icon"
    href="./assets/icons/icon-192.png"
  />
  
  <meta
    name="theme-color"
    content="#111111"
  />
  
  <meta
    name="mobile-web-app-capable"
    content="yes"
  />
  
  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />
  
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />

  <meta
    name="application-name"
    content="bookstore wishlist"
  />
  
  <meta
    name="apple-mobile-web-app-title"
    content="bookstore wishlist"
  />
  
  <meta
    name="format-detection"
    content="telephone=no"
  />
  
  <meta
    name="color-scheme"
    content="dark light"
  />

  <title>bookstore wishlist</title>

  <meta
    name="description"
    content="minimalist bookstore wishlist and ordering manager"
  />

  <meta name="theme-color" content="#111111" />

  <link rel="manifest" href="./manifest.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/utilities.css" />
  <link rel="stylesheet" href="./css/themes.css" />
  <link rel="stylesheet" href="./css/print.css" media="print" />
</head>

<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar__identity">
        <p class="eyebrow">collection</p>
        <h1 class="app-title">bookstore wishlist</h1>
      </div>

      <div class="topbar__actions">
        <button
          class="icon-button"
          id="theme-toggle"
          type="button"
          aria-label="toggle theme"
        >
          <span aria-hidden="true">◐</span>
        </button>
      </div>
    </header>

    <main class="main-layout">
      <section class="toolbar" aria-label="toolbar">
        <div class="toolbar__search">
          <label class="sr-only" for="search-input">search books</label>

          <input
            id="search-input"
            class="search-input"
            type="search"
            placeholder="search title, author, isbn"
            autocomplete="off"
          />
        </div>

        <div class="toolbar__actions">
          <button
            class="button button--primary"
            id="add-book-button"
            type="button"
          >
            add book
          </button>
        </div>
      </section>

      <section class="content-panel">
        <div class="collection-header">
          <div>
            <h2 class="section-title">library</h2>
            <p class="section-meta" id="collection-meta">
              0 books
            </p>
          </div>

          <div class="view-switcher" role="tablist" aria-label="view mode">
            <button
              class="view-switcher__button is-active"
              type="button"
              data-view="table"
            >
              table
            </button>

            <button
              class="view-switcher__button"
              type="button"
              data-view="card"
            >
              cards
            </button>
          </div>
        </div>

        <section
          id="view-root"
          class="view-root"
          aria-live="polite"
        ></section>
      </section>
    </main>
  </div>

  <template id="book-row-template">
    <article class="book-row">
      <div class="book-row__main">
        <h3 class="book-title"></h3>
        <p class="book-author"></p>
      </div>

      <div class="book-row__meta">
        <span class="book-status"></span>
        <span class="book-priority"></span>
      </div>
    </article>
  </template>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
